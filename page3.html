<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pick Date, Time & Place 🗓️</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      background-color: #fce4ec;
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      padding: 12px;
      position: relative;
    }

    .toast-alert {
      position: fixed;
      top: -70px;
      background-color: #ff4757;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(255, 71, 87, 0.35);
      transition: top 0.4s ease, opacity 0.4s ease;
      opacity: 0;
      z-index: 1000;
      pointer-events: none;
      text-align: center;
      max-width: 90%;
    }

    .toast-alert.show {
      top: 15px;
      opacity: 1;
    }

    .card {
      background-color: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 20px 18px;
      border-radius: 24px;
      box-shadow: 0 8px 25px rgba(255, 105, 180, 0.15);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      animation: popIn 0.35s ease-out forwards;
      margin: auto;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }

    .live-datetime-card {
      background: #fffafc;
      border: 2px dashed #f8bbd0;
      border-radius: 16px;
      padding: 8px 12px;
      width: 100%;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .live-time-display {
      font-size: 1.25rem;
      font-weight: 900;
      color: #ad1457;
      letter-spacing: 0.8px;
    }

    .live-date-display {
      font-size: 0.82rem;
      font-weight: 700;
      color: #747d8c;
      margin-top: 2px;
    }

    .image-container {
      width: 100px;
      height: 100px;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 10px;
      border: 3px solid #f8bbd0;
      flex-shrink: 0;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .title {
      font-size: 1.15rem;
      color: #ad1457;
      font-weight: 800;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .form-group {
      width: 100%;
      text-align: left;
      margin-bottom: 11px;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      color: #747d8c;
      font-weight: bold;
      margin-bottom: 4px;
      margin-left: 4px;
    }

    .input-field {
      width: 100%;
      padding: 10px 14px;
      font-size: 0.92rem;
      border: 2px solid #f8bbd0;
      border-radius: 14px;
      outline: none;
      color: #2f3542;
      background-color: #fffafc;
      font-weight: 600;
      transition: all 0.25s ease;
    }

    .text-center {
      text-align: center;
    }

    .input-field:focus {
      border-color: #ec407a;
    }

    /* Place Box Highlight Animation */
    .highlight-place {
      border-color: #ff4757 !important;
      background-color: #fff0f3 !important;
      box-shadow: 0 0 12px rgba(255, 71, 87, 0.45) !important;
      animation: pulseGlow 1.2s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(1); }
      100% { transform: scale(1.02); }
    }

    .date-picker-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .date-display-box {
      width: 100%;
      padding: 10px 115px 10px 14px;
      font-size: 0.92rem;
      border: 2px solid #f8bbd0;
      border-radius: 14px;
      color: #2f3542;
      background-color: #fffafc;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .date-select-btn {
      position: absolute;
      right: 5px;
      background: linear-gradient(135deg, #ff4b72, #e81b54);
      color: white;
      font-size: 0.76rem;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(232, 27, 84, 0.35);
      pointer-events: none;
      transition: transform 0.15s ease;
    }

    .date-picker-wrapper:hover .date-select-btn {
      transform: scale(1.04);
    }

    .hidden-date-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 10;
    }

    .selected-status-badge {
      display: none;
      margin-top: 6px;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 12px;
      text-align: center;
      width: 100%;
      animation: popIn 0.25s ease-out;
    }

    .status-holiday {
      background-color: #ffeaa7;
      color: #d63031;
      border: 1.5px solid #ff7675;
    }

    .status-weekend {
      background-color: #ff7675;
      color: #ffffff;
    }

    .status-working {
      background-color: #55efc4;
      color: #00b894;
      border: 1.5px solid #00b894;
    }

    .weather-detail-card {
      display: none;
      margin-top: 10px;
      background: linear-gradient(135deg, #e0f2fe, #f0f9ff);
      border: 2px solid #7dd3fc;
      border-radius: 16px;
      padding: 10px 12px;
      text-align: left;
      animation: popIn 0.25s ease-out;
    }

    .weather-header {
      font-size: 0.85rem;
      font-weight: 800;
      color: #0369a1;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .weather-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .weather-item {
      background: rgba(255, 255, 255, 0.75);
      padding: 6px 8px;
      border-radius: 10px;
      font-size: 0.74rem;
      font-weight: 700;
      color: #0c4a6e;
    }

    .weather-tip {
      margin-top: 6px;
      font-size: 0.74rem;
      font-weight: 800;
      color: #b91c1c;
      background: #fef2f2;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px dashed #fca5a5;
      text-align: center;
      line-height: 1.25;
    }

    select.input-field {
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg fill='%23ec407a' height='20' viewBox='0 0 24 24' width='20' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 14px;
    }

    .btn-set {
      width: 100%;
      background: linear-gradient(135deg, #ff4b72, #e81b54);
      color: white;
      padding: 11px 18px;
      font-size: 0.95rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 5px;
      box-shadow: 0 4px 14px rgba(232, 27, 84, 0.4);
      transition: all 0.2s ease;
    }

    .btn-set:hover {
      background: linear-gradient(135deg, #e81b54, #c2185b);
      transform: translateY(-2px);
    }

    .footer {
      position: fixed;
      bottom: 6px;
      font-size: 0.72rem;
      color: #c2185b;
      opacity: 0.75;
      user-select: none;
    }
  </style>
</head>
<body>

  <div class="toast-alert" id="topAlert">⚠️ Error Message</div>

  <div class="card">
    <div class="live-datetime-card">
      <div class="live-time-display" id="liveClockDisplay">🕒 00:00:00 AM</div>
      <div class="live-date-display" id="liveDateText">📅 Loading date...</div>
    </div>

    <div class="image-container">
      <img src="image_folder/img3.jpg" alt="Date Picker" onerror="this.src='image_folder/img3.jpeg'" />
    </div>

    <div class="title">So... when are you free? 🗓️</div>

    <!-- Date Picker Field -->
    <div class="form-group">
      <label class="form-label">Pick Date 📅</label>
      <div class="date-picker-wrapper" onclick="openCalendar()">
        <div class="date-display-box" id="dateDisplayText">📅 Select Date...</div>
        <div class="date-select-btn">📅 Choose Date</div>
        <input type="date" id="singleDateInput" class="hidden-date-input" onchange="evaluateSelectedDate()" />
      </div>
      
      <div id="selectedStatusBadge" class="selected-status-badge"></div>
    </div>

    <!-- Time Selector -->
    <div class="form-group">
      <label class="form-label" for="timeSelect">What Time? ⏰</label>
      <select id="timeSelect" class="input-field text-center" onchange="handleTimeSelected()">
        <option value="" disabled selected>Select a time...</option>
      </select>
    </div>

    <!-- Location Field -->
    <div class="form-group">
      <label class="form-label" for="placeInput">Where are we going? 📍</label>
      <input type="text" id="placeInput" class="input-field" placeholder="e.g. Interlaken, Switzerland" oninput="handlePlaceInput()" autocomplete="off" />
    </div>

    <!-- Weather Forecast Display in English -->
    <div id="weatherDetailCard" class="weather-detail-card">
      <div class="weather-header">
        <span id="weatherMainStatus">🌦️ Weather Status</span>
        <span id="weatherTempBadge">🌡️ 0°C</span>
      </div>
      <div class="weather-grid">
        <div class="weather-item" id="rainStatus">🌧️ Rain: 0%</div>
        <div class="weather-item" id="heatStatus">🔥 Vibe: Normal</div>
        <div class="weather-item" id="windStatus">💨 Wind: Calm</div>
        <div class="weather-item" id="cloudStatus">💧 Humidity: Normal</div>
      </div>
      <div class="weather-tip" id="datingWeatherTip">💡 Tip: Pleasant date weather predicted!</div>
    </div>

    <button class="btn-set" onclick="submitDate()">set the date! 💖</button>
  </div>

  <div class="footer">Designed & Developed by PRANTO</div>

  <script>
    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

    // Lock Date Selection to Today & Future Only
    const today = new Date();
    const currentYear = today.getFullYear();
    const currentMonth = String(today.getMonth() + 1).padStart(2, '0');
    const currentDay = String(today.getDate()).padStart(2, '0');
    const todayStr = `${currentYear}-${currentMonth}-${currentDay}`;

    const dateInput = document.getElementById('singleDateInput');
    dateInput.min = todayStr;

    function openCalendar() {
      if (dateInput.showPicker) {
        dateInput.showPicker();
      } else {
        dateInput.focus();
      }
    }

    function updateLiveDateTime() {
      const now = new Date();

      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      const formattedHours = String(hours).padStart(2, '0');
      document.getElementById('liveClockDisplay').innerText = `🕒 ${formattedHours}:${minutes}:${seconds} ${ampm}`;

      const dayName = days[now.getDay()];
      const dateNum = now.getDate();
      const monthName = months[now.getMonth()];
      const yearNum = now.getFullYear();

      document.getElementById('liveDateText').innerText = `📅 ${dayName}, ${dateNum} ${monthName} ${yearNum}`;
    }
    updateLiveDateTime();
    setInterval(updateLiveDateTime, 1000);

    let userCountryCode = 'BD';
    let userLat = 23.8103;
    let userLon = 90.4125;
    let holidaysCache = {};

    fetch('https://ipapi.co/json/')
      .then(res => res.json())
      .then(data => {
        if (data && data.country_code) {
          userCountryCode = data.country_code;
          if (data.latitude && data.longitude) {
            userLat = data.latitude;
            userLon = data.longitude;
          }
        }
      })
      .catch(() => {
        const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
        if (timeZone.includes('Dhaka')) userCountryCode = 'BD';
        else if (timeZone.includes('Calcutta') || timeZone.includes('Kolkata')) userCountryCode = 'IN';
        else if (timeZone.includes('New_York') || timeZone.includes('America')) userCountryCode = 'US';
        else userCountryCode = 'BD';
      });

    async function getHolidayInfo(yearStr, dateStr) {
      const cacheKey = `${userCountryCode}_${yearStr}`;
      if (!holidaysCache[cacheKey]) {
        try {
          const res = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${yearStr}/${userCountryCode}`);
          holidaysCache[cacheKey] = res.ok ? await res.json() : [];
        } catch (e) {
          holidaysCache[cacheKey] = [];
        }
      }
      const matched = (holidaysCache[cacheKey] || []).find(h => h.date === dateStr);
      return matched ? (matched.name || matched.localName) : null;
    }

    async function evaluateSelectedDate() {
      const val = dateInput.value;
      const displayBox = document.getElementById('dateDisplayText');
      const badge = document.getElementById('selectedStatusBadge');

      if (!val) {
        displayBox.innerText = '📅 Select Date...';
        badge.style.display = 'none';
        return;
      }

      const [yearStr, monthStr, dayStr] = val.split('-');
      const selectedDate = new Date(parseInt(yearStr), parseInt(monthStr) - 1, parseInt(dayStr));
      
      const dayIndex = selectedDate.getDay();
      const dayName = days[dayIndex];
      const monthName = months[selectedDate.getMonth()];

      displayBox.innerText = `📅 ${dayStr} ${monthName}, ${yearStr}`;

      const holidayName = await getHolidayInfo(yearStr, val);
      badge.style.display = 'block';

      if (holidayName) {
        badge.className = 'selected-status-badge status-holiday';
        badge.innerText = `🎉 ${dayName} - Public Holiday (${holidayName}) 🏖️`;
      } else {
        const isWeekend = (userCountryCode === 'BD') 
          ? (dayIndex === 5 || dayIndex === 6)
          : (dayIndex === 0 || dayIndex === 6);

        if (isWeekend) {
          badge.className = 'selected-status-badge status-weekend';
          badge.innerText = `🏖️ ${dayName} (Weekend / Off Day ✨)`;
        } else {
          badge.className = 'selected-status-badge status-working';
          badge.innerText = `💼 ${dayName} (Working Day)`;
        }
      }

      fetchWeatherForPlace();
    }

    // Time Selection Handler: Shows Weather & Highlights Place Box
    function handleTimeSelected() {
      fetchWeatherForPlace();
      
      const placeField = document.getElementById('placeInput');
      if (placeField.value.trim().length === 0) {
        placeField.classList.add('highlight-place');
        placeField.focus();
      }
    }

    // Remove Highlight once at least 1 character is entered
    function handlePlaceInput() {
      const placeField = document.getElementById('placeInput');
      if (placeField.value.trim().length > 0) {
        placeField.classList.remove('highlight-place');
      }
      fetchWeatherForPlace();
    }

    // Weather Forecast & Smart Advice
    async function fetchWeatherForPlace() {
      const dateVal = dateInput.value;
      const timeVal = document.getElementById('timeSelect').value;
      const placeVal = document.getElementById('placeInput').value.trim();
      const weatherCard = document.getElementById('weatherDetailCard');

      if (!dateVal || !timeVal) {
        weatherCard.style.display = 'none';
        return;
      }

      let targetLat = userLat;
      let targetLon = userLon;

      if (placeVal.length > 2) {
        try {
          const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(placeVal)}&count=1&language=en&format=json`);
          if (geoRes.ok) {
            const geoData = await geoRes.json();
            if (geoData.results && geoData.results.length > 0) {
              targetLat = geoData.results[0].latitude;
              targetLon = geoData.results[0].longitude;
            }
          }
        } catch (e) {}
      }

      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${targetLat}&longitude=${targetLon}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,windspeed_10m_max,relative_humidity_2m_max&timezone=auto`);
        if (res.ok) {
          const data = await res.json();
          const dates = data.daily.time || [];
          const idx = dates.indexOf(dateVal);

          weatherCard.style.display = 'block';

          if (idx !== -1) {
            const tempMax = Math.round(data.daily.temperature_2m_max[idx]);
            const tempMin = Math.round(data.daily.temperature_2m_min[idx]);
            const rainProb = data.daily.precipitation_probability_max[idx] || 0;
            const wind = Math.round(data.daily.windspeed_10m_max[idx] || 10);
            const humidity = data.daily.relative_humidity_2m_max ? data.daily.relative_humidity_2m_max[idx] : 60;
            const code = data.daily.weathercode[idx];

            let condition = "Sunny & Clear ☀️";
            let tips = [];

            if (rainProb >= 50 || (code >= 51 && code <= 67) || (code >= 80 && code <= 82)) {
              condition = "Rain Expected 🌧️⛈️";
              tips.push("☔ Carry an umbrella — high chance of rain!");
            } else if (rainProb >= 25) {
              condition = "Light Showers Possible 🌦️";
              tips.push("🌂 Keep a pocket umbrella handy!");
            } else if (code >= 1 && code <= 3) {
              condition = "Partly Cloudy ⛅";
            }

            let tempStatus = "Pleasant & Mild 😊";
            if (tempMax >= 34) {
              tempStatus = "Very Hot 🔥";
              tips.push("🎽 Wear light, breathable cotton clothes & stay hydrated!");
            } else if (tempMin <= 16) {
              tempStatus = "Chilly / Cold ❄️";
              tips.push("🧥 Keep a warm jacket or stylish hoodie on!");
            } else {
              tips.push("✨ Perfect weather for a romantic date!");
            }

            if (timeVal.includes('PM') && parseInt(timeVal) >= 7) {
              tips.push("🌙 Evening date vibe — breezy & cool!");
            }

            document.getElementById('weatherMainStatus').innerText = `Forecast: ${condition}`;
            document.getElementById('weatherTempBadge').innerText = `🌡️ ${tempMin}°C - ${tempMax}°C`;
            document.getElementById('rainStatus').innerText = `🌧️ Rain: ${rainProb}% Chance`;
            document.getElementById('heatStatus').innerText = `🔥 Vibe: ${tempStatus}`;
            document.getElementById('windStatus').innerText = `💨 Wind: ${wind} km/h`;
            document.getElementById('cloudStatus').innerText = `💧 Humidity: ${humidity}%`;
            document.getElementById('datingWeatherTip').innerText = `💡 Advice: ${tips.join(' ')}`;
          } else {
            document.getElementById('weatherMainStatus').innerText = `Forecast: Seasonal Outlook 🌤️`;
            document.getElementById('weatherTempBadge').innerText = `🌡️ Favorable`;
            document.getElementById('rainStatus').innerText = `🌧️ Rain: Moderate`;
            document.getElementById('heatStatus').innerText = `🔥 Vibe: Comfortable`;
            document.getElementById('windStatus').innerText = `💨 Wind: Calm`;
            document.getElementById('cloudStatus').innerText = `💧 Humidity: Normal`;
            document.getElementById('datingWeatherTip').innerText = `💡 Advice: Dress comfortably for your date at ${timeVal}! ✨`;
          }
        }
      } catch (e) {
        weatherCard.style.display = 'none';
      }
    }

    // Populate 24-Hour 12-Hour Format Time Dropdown (Every 30 Minutes)
    const timeSelect = document.getElementById('timeSelect');
    for (let h = 0; h < 24; h++) {
      for (let m = 0; m < 60; m += 30) {
        let displayHours = h % 12;
        displayHours = displayHours ? displayHours : 12;
        const formattedH = String(displayHours).padStart(2, '0');
        const formattedM = String(m).padStart(2, '0');
        const ampm = h >= 12 ? 'PM' : 'AM';
        
        const timeValue = `${formattedH}:${formattedM} ${ampm}`;
        const option = document.createElement('option');
        option.value = timeValue;
        option.innerText = timeValue;
        timeSelect.appendChild(option);
      }
    }

    function showAlert(msg) {
      const alertBox = document.getElementById('topAlert');
      alertBox.innerText = msg;
      alertBox.classList.add('show');
      setTimeout(() => alertBox.classList.remove('show'), 3000);
    }

    function submitDate() {
      const dateVal = dateInput.value;
      const time = timeSelect.value;
      const place = document.getElementById('placeInput').value.trim();

      if (!dateVal || !time) {
        showAlert('⚠️ Please pick Date and Time!');
        return;
      }

      if (place.length < 1) {
        showAlert('⚠️ Please enter where we are going!');
        const placeField = document.getElementById('placeInput');
        placeField.classList.add('highlight-place');
        placeField.focus();
        return;
      }

      const [y, m, d] = dateVal.split('-');
      const formattedDate = `${d}/${m}/${y}`;

      localStorage.setItem('datingDate', formattedDate);
      localStorage.setItem('datingTime', time);
      localStorage.setItem('datingPlace', place);

      confetti({ particleCount: 70, spread: 60, origin: { y: 0.6 } });

      setTimeout(() => {
        window.location.href = 'page4.html';
      }, 400);
    }
  </script>
</body>
</html>
