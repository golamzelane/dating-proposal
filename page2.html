  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      padding: 16px 12px 35px 12px;
      position: relative;
    }

    .card {
      background-color: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 30px 22px;
      border-radius: 28px;
      box-shadow: 0 12px 35px rgba(233, 30, 99, 0.2);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      animation: popIn 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      margin: auto;
      border: 2px solid #fce4ec;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.88);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .image-container {
      width: 130px;
      height: 130px;
      border-radius: 22px;
      overflow: hidden;
      margin-bottom: 16px;
      border: 3.5px solid #f48fb1;
      box-shadow: 0 6px 18px rgba(244, 143, 177, 0.35);
      flex-shrink: 0;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge {
      background: #fce4ec;
      color: #ad1457;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: 1px solid #f8bbd0;
    }

    .title {
      font-size: 1.32rem;
      color: #ad1457;
      font-weight: 900;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .subtitle {
      font-size: 0.88rem;
      color: #4b5563;
      margin-bottom: 22px;
      line-height: 1.5;
      font-weight: 600;
      padding: 0 6px;
    }

    .btn-okay {

      background: linear-gradient(135deg, #ff4b72, #e81b54);
      color: white;
      padding: 12px 24px;
      font-size: 0.96rem;
      font-weight: 800;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(232, 27, 84, 0.35);
      transition: all 0.2s ease;
      letter-spacing: 0.3px;
    }

    .btn-okay:hover {
      background: linear-gradient(135deg, #e81b54, #c2185b);
      transform: translateY(-2px);
    }

    .footer {
      position: fixed;
      bottom: 8px;
      font-size: 0.72rem;
      color: #c2185b;
      opacity: 0.75;
      user-select: none;
      text-align: center;
      width: 100%;
      font-weight: 600;

  </style>
