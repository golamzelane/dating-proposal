<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wait... Really?! 😭</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Comic Sans MS', 'Segoe UI', cursive, sans-serif;
    }

    body {
      background-color: #fce4ec;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 15px;
      position: relative;
    }

    .card {
      background-color: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 35px 25px;
      border-radius: 28px;
      box-shadow: 0 10px 25px rgba(255, 105, 180, 0.15);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popIn 0.5s ease-out forwards;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.85);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .image-container {
      width: 140px;
      height: 140px;
      border-radius: 22px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 3px solid #f8bbd0;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .title {
      font-size: 1.35rem;
      color: #ad1457;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      line-height: 1.3;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #636e72;
      margin-bottom: 25px;
      font-weight: 500;
    }

    .btn-okay {
      background-color: #ec407a;
      color: white;
      padding: 12px 32px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(236, 64, 122, 0.35);
      transition: transform 0.2s ease, background-color 0.2s;
    }

    .btn-okay:hover {
      background-color: #d81b60;
      transform: scale(1.05);
    }

    .footer {
      position: fixed;
      bottom: 12px;
      font-size: 0.85rem;
      color: #c2185b;
      opacity: 0.75;
      user-select: none;
    }

    @media (max-width: 480px) {
      .card {
        padding: 25px 20px;
      }
      .title {
        font-size: 1.15rem;
      }
      .subtitle {
        font-size: 0.85rem;
      }
      .image-container {
        width: 120px;
        height: 120px;
      }
      .btn-okay {
        padding: 10px 26px;
        font-size: 0.9rem;
      }
      .footer {
        font-size: 0.75rem;
        bottom: 8px;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="image-container">
      <img src="image_folder/img2.jpg" alt="Surprised Image" onerror="this.src='image_folder/img2.jpeg'" />
    </div>

    <div class="title">
      WAIT YOU ACTUALLY<br>SAID YES?? 😭
    </div>

    <div class="subtitle">
      i was so ready for you to say no 😜
    </div>

    <button class="btn-okay" onclick="nextPage()">
      okay okay! ➔
    </button>
  </div>

  <div class="footer">
    Designed & Developed by PRANTO
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const duration = 2.5 * 1000;
      const animationEnd = Date.now() + duration;

      const frame = () => {
        confetti({
          particleCount: 3,
          angle: 60,
          spread: 55,
          origin: { x: 0, y: 0 }
        });
        confetti({
          particleCount: 3,
          angle: 120,
          spread: 55,
          origin: { x: 1, y: 0 }
        });

        if (Date.now() < animationEnd) {
          requestAnimationFrame(frame);
        }
      };

      frame();
    });

    // OKAY OKAY বাটনে ক্লিক করলে page3.html এ যাবে
    function nextPage() {
      window.location.href = 'page3.html';
    }
  </script>
</body>
</html>
