<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>It's Official! 🎉💖</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Comic Sans MS', 'Segoe UI', cursive, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      padding: 16px 12px 35px 12px;
      position: relative;
    }

    .card {
      background-color: #ffffff;
      width: 100%;
      max-width: 390px;
      padding: 26px 20px;
      border-radius: 28px;
      box-shadow: 0 12px 35px rgba(233, 30, 99, 0.2);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      animation: popScale 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      margin: auto;
      border: 2px solid #fce4ec;
    }

    @keyframes popScale {
      0% { opacity: 0; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    .image-container {
      width: 115px;
      height: 115px;
      border-radius: 22px;
      overflow: hidden;
      margin-bottom: 14px;
      border: 3.5px solid #f48fb1;
      box-shadow: 0 6px 18px rgba(244, 143, 177, 0.4);
      flex-shrink: 0;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge {
      background: #fce4ec;
      color: #ad1457;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 8px;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: 1px solid #f8bbd0;
    }

    .title {
      font-size: 1.35rem;
      color: #ad1457;
      font-weight: 900;
      margin-bottom: 8px;
      line-height: 1.25;
    }

    .status-msg {
      font-size: 0.85rem;
      color: #57606f;
      margin-bottom: 16px;
      line-height: 1.45;
      padding: 0 4px;
    }

    .summary-box {
      width: 100%;
      background: #fffafc;
      border: 2px dashed #f48fb1;
      border-radius: 20px;
      padding: 16px 16px;
      text-align: left;
      font-size: 0.88rem;
      color: #2f3542;
      margin-bottom: 16px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
    }

    .summary-item {
      margin: 8px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .summary-item strong {
      color: #747d8c;
      font-size: 0.82rem;
    }

    .summary-val {
      font-weight: 800;
      color: #e91e63;
      text-align: right;
      font-size: 0.85rem;
    }

    .end-note {
      font-size: 0.85rem;
      font-weight: 800;
      color: #ad1457;
      margin-top: 2px;
      line-height: 1.3;
    }

    .footer {
      position: fixed;
      bottom: 8px;
      font-size: 0.72rem;
      color: #c2185b;
      opacity: 0.75;
      user-select: none;
      text-align: center;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="image-container">
      <img src="image_folder/img7.jpg" alt="Final Date Poster" onerror="this.src='image_folder/img7.jpeg'" />
    </div>

    <div class="badge">Date Locked In 🔒</div>
    <div class="title" id="finalTitle">It's a Date! 🎉💖</div>
    
    <div class="status-msg" id="finalStatusMsg">
      Getting everything ready for you!
    </div>

    <!-- Final Summary Details -->
    <div class="summary-box">
      <div class="summary-item">
        <strong>📅 Date:</strong>
        <span class="summary-val" id="sumDate">TBD</span>
      </div>
      <div class="summary-item">
        <strong>⏰ Time:</strong>
        <span class="summary-val" id="sumTime">TBD</span>
      </div>
      <div class="summary-item">
        <strong>📍 Place:</strong>
        <span class="summary-val" id="sumPlace">TBD</span>
      </div>
      <div class="summary-item">
        <strong>🍔 Vibes:</strong>
        <span class="summary-val" id="sumFood">TBD</span>
      </div>
    </div>

    <div class="end-note">Can't wait to see your prettiest smile! 🌹✨</div>
  </div>

  <div class="footer">Designed & Developed by PRANTO</div>

  <script>
    function fireCelebration() {
      const end = Date.now() + 2 * 1000;
      const colors = ['#ec407a', '#f48fb1', '#ff4757', '#ffffff', '#ffd1dc'];

      (function frame() {
        confetti({
          particleCount: 4,
          angle: 60,
          spread: 60,
          origin: { x: 0 },
          colors: colors
        });
        confetti({
          particleCount: 4,
          angle: 120,
          spread: 60,
          origin: { x: 1 },
          colors: colors
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      }());
    }

    fireCelebration();

    const partner = localStorage.getItem('partnerName') || 'Cutie';
    const date = localStorage.getItem('datingDate') || 'Soon';
    const time = localStorage.getItem('datingTime') || 'On Time';
    const place = localStorage.getItem('datingPlace') || 'Secret Spot';
    const food = localStorage.getItem('datingFood') || 'Yummy Treats';
    const status = localStorage.getItem('paymentStatus');

    document.getElementById('sumDate').innerText = date;
    document.getElementById('sumTime').innerText = time;
    document.getElementById('sumPlace').innerText = place;
    document.getElementById('sumFood').innerText = food;

    if (status === 'paid') {
      document.getElementById('finalTitle').innerText = "VIP Date Confirmed! 💖✨";
      document.getElementById('finalStatusMsg').innerHTML = `Aww, thank you for the sweet fee, <strong>${partner}</strong>! You just unlocked the most unforgettable VIP date! 🥂🌸`;
    } else {
      document.getElementById('finalTitle').innerText = "You're My Guest! 🍰💖";
      document.getElementById('finalStatusMsg').innerHTML = `Don't worry at all, <strong>${partner}</strong>! The entire treat is on me. Just bring yourself and that lovely smile! 🥰✨`;
    }
  </script>
</body>
</html>
