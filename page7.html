    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      padding: 16px 12px 35px 12px;
      position: relative;
    }

    .card {
      background-color: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 24px 18px;
      border-radius: 28px;
      box-shadow: 0 12px 35px rgba(233, 30, 99, 0.2);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      animation: popScale 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      margin: auto;
      border: 2px solid #fce4ec;
    }

    @keyframes popScale {
      0% { opacity: 0; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    .image-container {
      width: 110px;
      height: 110px;
      border-radius: 22px;
      overflow: hidden;
      margin-bottom: 12px;
      border: 3.5px solid #f48fb1;
      box-shadow: 0 6px 18px rgba(244, 143, 177, 0.4);
      flex-shrink: 0;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge {
      background: #fce4ec;
      color: #ad1457;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 8px;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: 1px solid #f8bbd0;
    }

    .title {
      font-size: 1.35rem;
      color: #ad1457;
      font-weight: 900;
      margin-bottom: 8px;
      line-height: 1.25;
    }

    .status-msg {
      font-size: 0.88rem;
      color: #4b5563;
      margin-bottom: 14px;
      line-height: 1.5;
      padding: 0 4px;
      font-weight: 600;
    }

    .status-msg strong {
      color: #ad1457;
      font-weight: 800;
    }

    .summary-box {

      background: #fffafc;
      border: 2px dashed #f48fb1;
      border-radius: 18px;
      padding: 14px 14px;
      text-align: left;
      font-size: 0.86rem;
      color: #2f3542;
      margin-bottom: 12px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
    }

    .summary-item {
      margin: 7px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .summary-item strong {
      color: #747d8c;
      font-size: 0.82rem;
      white-space: nowrap;
    }

    .summary-val {
      font-weight: 800;
      color: #e91e63;
      text-align: right;
      font-size: 0.84rem;
      word-break: break-word;
