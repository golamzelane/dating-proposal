  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: #fce4ec;
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      padding: 14px 10px 30px 10px;
      position: relative;
    }

    .card {
      background-color: #ffffff;
      width: 100%;
      max-width: 390px;
      padding: 26px 20px;
      border-radius: 26px;
      box-shadow: 0 10px 30px rgba(255, 105, 180, 0.18);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      animation: popIn 0.4s ease-out forwards;
      margin: auto;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1); }
    }

    .image-container {
      width: 120px;
      height: 120px;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 14px;
      border: 3.5px solid #f8bbd0;
      box-shadow: 0 4px 14px rgba(248, 187, 208, 0.4);
      flex-shrink: 0;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge {
      background: #fce4ec;
      color: #ad1457;
      font-size: 0.74rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 8px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      border: 1px solid #f8bbd0;
    }

    .title {
      font-size: 1.25rem;
      color: #ad1457;
      font-weight: 900;
      margin-bottom: 8px;
      line-height: 1.35;
    }

    .sub-note {
      font-size: 0.84rem;
      color: #57606f;
      line-height: 1.45;
      margin-bottom: 12px;
      padding: 0 6px;
      font-weight: 600;
    }

    .hearts-row {
      color: #f48fb1;
      font-size: 1rem;
      margin-bottom: 14px;
      letter-spacing: 4px;
    }

    .btn-accept {
      width: 100%;
      background: linear-gradient(135deg, #ff4b72, #e81b54);
      color: white;
      padding: 12px 18px;
      font-size: 0.94rem;
      font-weight: 800;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(232, 27, 84, 0.35);
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .btn-accept:hover {
      background: linear-gradient(135deg, #e81b54, #c2185b);
      transform: translateY(-2px);
    }

    .btn-accept:active {
      transform: scale(0.97);
    }

    .footer {
      position: fixed;
      bottom: 8px;
      font-size: 0.72rem;
      color: #c2185b;
      opacity: 0.75;
      user-select: none;
      text-align: center;
      width: 100%;
      font-weight: 600;
